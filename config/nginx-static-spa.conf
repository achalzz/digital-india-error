# Static SPA alternative to nginx-wordpress.conf; use only one deployment model.
server {
    listen 80;
    listen [::]:80;
    server_name error-decoder.in www.error-decoder.in;

    root /var/www/error-decoder/public;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|json|xml|txt|png|svg|ico|webmanifest)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}