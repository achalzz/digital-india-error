# Nginx Hardened Configuration for Digital India Error Decoder
# Target: Ubuntu LTS (Nginx + PHP 8.3-FPM + Cloudflare SSL Full/Strict)

# 1. FastCGI Cache Configuration (place in /etc/nginx/nginx.conf or conf.d/cache.conf)
# fastcgi_cache_path /var/run/nginx-cache levels=1:2 keys_zone=WORDPRESS:100m inactive=60m max_size=1g;
# fastcgi_cache_key "$scheme$request_method$host$request_uri";
# fastcgi_cache_use_stale error timeout updating invalid_header http_500;
# fastcgi_ignore_headers Cache-Control Expires Set-Cookie;

server {
    listen 80;
    listen [::]:80;
    server_name error-decoder.in www.error-decoder.in;
    return 301 https://error-decoder.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.error-decoder.in;

    # SSL Certificates (Cloudflare Origin CA or Let's Encrypt)
    ssl_certificate /etc/ssl/certs/origin-cert.pem;
    ssl_certificate_key /etc/ssl/private/origin-key.pem;

    return 301 https://error-decoder.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name error-decoder.in;

    root /var/www/error-decoder;
    index index.php index.html;

    # SSL Certificates & Security
    ssl_certificate /etc/ssl/certs/origin-cert.pem;
    ssl_certificate_key /etc/ssl/private/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    # Cloudflare Real IP Restoration
    # include /etc/nginx/conf.d/cloudflare.conf; # Contains set_real_ip_from and real_ip_header CF-Connecting-IP;

    # Upload & Body limits
    client_max_body_size 16M;

    # Cache exclusions logic
    set $skip_cache 0;

    # POST requests and URLs with query strings should skip cache
    if ($request_method = POST) {
        set $skip_cache 1;
    }
    if ($query_string != "") {
        set $skip_cache 1;
    }

    # Don't cache uris containing the following segments
    if ($request_uri ~* "(/wp-admin/|/xmlrpc.php|/wp-(app|cron|login|register).php|wp-.*.php|/feed/|index.php|sitemap(_index)?.xml)") {
        set $skip_cache 1;
    }

    # Don't use the cache for logged-in users or recent commenters
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in") {
        set $skip_cache 1;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # FastCGI PHP Execution
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        
        # FastCGI Cache Directive
        # fastcgi_cache WORDPRESS;
        # fastcgi_cache_valid 200 301 302 60m;
        # fastcgi_cache_bypass $skip_cache;
        # fastcgi_no_cache $skip_cache;
        # add_header X-Cache $upstream_cache_status;
    }

    # Security Rule 1: Block execution of PHP in uploads folder
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    # Security Rule 2: Deny hidden files (e.g. .htaccess, .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security Rule 3: Protect wp-config.php and sensitive files
    location = /wp-config.php {
        deny all;
    }
    location = /xmlrpc.php {
        deny all; # Prevent XML-RPC brute force/DDoS attacks
    }

    # Static Assets Caching
    location ~* \.(ogg|ogv|svg|svgz|eot|otf|woff|woff2|mp4|ttf|css|rss|atom|js|jpg|jpeg|gif|png|ico|zip|tgz|gz|rar|bz2|doc|xls|exe|ppt|tar|mid|midi|wav|bmp|rtf|webp)$ {
        expires max;
        log_not_found off;
        access_log off;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    }

    # Logging
    access_log /var/log/nginx/error-decoder_access.log;
    error_log /var/log/nginx/error-decoder_error.log;
}
